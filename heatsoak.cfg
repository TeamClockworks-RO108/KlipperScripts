
#  P A R A M E T E R S :
#
# TARGET      - Target temperature to heat the bed to.
# CHAMBER     - Nominal target temperature for the chamber heater (used as the
#               setter). 0 (default) disables chamber heating entirely.
# CHAMBER_MIN - Minimum chamber temperature to wait for before continuing.
#               Defaults to CHAMBER - chamber_wait_offset when omitted.
#

[gcode_macro HEATSOAK]
description: "Gradually heat the bed in small increments to a target (default 115C)"
variable_step_size: 8
variable_step_first_temperature_tgt: 90
variable_step_increment_delta: 2
# Default offset under CHAMBER used as CHAMBER_MIN when the caller omits it
variable_chamber_wait_offset: 1
variable_fan_list: ["Nevermore", "bed_fans"]
gcode:
    {% set target = params.TARGET|default(115)|int %}
    {% set chamber = params.CHAMBER|default(0)|int %}
    {% set chamber_min = params.CHAMBER_MIN|default(chamber - chamber_wait_offset)|int %}
    {% set current = printer['heater_bed'].temperature|int %}

    {% if current >= target %}
        M117 Bed already at or above target ({current}*C)
        {% if chamber > 0 %}
          M141 S{chamber}
        {% endif %}
        G4 P2000
        BEEP
        G4 P1000
        BEEP
    {% else %}
        {% for fan in fan_list %}
          SET_FAN_SPEED FAN={fan} SPEED=1
        {% endfor %}

        {% if chamber > 0 %}
          M141 S{chamber}
          M117 Chamber heater set to {chamber}*C
        {% endif %}

        {% set start_temp = current + step_size if current + step_size > step_first_temperature_tgt else step_first_temperature_tgt %}
        {% set span = target - start_temp %}

        {% for i in range(20) %}
          {% set temp = start_temp + i * step_size %}
          {% if temp < target %}
            {% set wait_temp = temp - step_increment_delta %}
            {% set g = (temp - start_temp) / (span|float) if span > 0 else 0 %}
            SET_LED_COLOR GRADIENT={g}
            M140 S{temp}
            M117 Heating bed to {temp}*C
            TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={wait_temp}
            G4 P1000
          {% endif %}
        {% endfor %}

        SET_LED_COLOR COLOR=RED
        M140 S{target}
        M117 Final heating to {target}*C
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={target}
        SET_FAN_SPEED FAN=Nevermore SPEED=0
        SET_FAN_SPEED FAN=bed_fans SPEED=0

        {% if chamber > 0 %}
          M117 Waiting for chamber to reach {chamber_min}*C
          TEMPERATURE_WAIT SENSOR="heater_chamber chamber" MINIMUM={chamber_min}
        {% endif %}

        G4 P1000
        BEEP
    {% endif %}
